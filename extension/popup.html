<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      color-scheme: light;
      --paper: #fbfaf7;
      --surface: #ffffff;
      --ink: #1d1d1b;
      --muted: #77736c;
      --quiet: #a19c93;
      --line: #e4e0d8;
      --soft: #f2efe9;
      --accent: #d85a30;
      --accent-soft: #f8e9e3;
      --success: #4e735a;
      --warning: #a66a22;
      --danger: #a3443b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 328px;
      color: var(--ink);
      background: var(--paper);
      font: 13px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 2px solid rgba(216,90,48,.35); outline-offset: 2px; }

    .head { display: flex; align-items: center; gap: 10px; padding: 18px 18px 15px; }
    .head img { width: 25px; height: 25px; }
    .wordmark { font-size: 14px; font-weight: 680; letter-spacing: -.01em; }
    .sub { margin-top: 1px; color: var(--quiet); font-size: 10.5px; }

    .status { display: flex; align-items: center; gap: 8px; margin: 0 18px; padding: 11px 0 5px; border-top: 1px solid var(--line); }
    .dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }
    .ok { background: var(--success); }
    .warn { background: var(--warning); }
    .bad { background: var(--danger); }
    #statusText { font-size: 11.5px; font-weight: 560; }
    .hint { padding: 0 18px 13px 32px; color: var(--muted); font-size: 10.5px; }
    .hint code { padding: 1px 4px; border-radius: 4px; background: var(--soft); font-size: 10px; user-select: all; }

    .stats { display: none; margin: 0 18px 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    .row { display: flex; justify-content: space-between; padding: 3px 0; color: var(--muted); font-size: 10.5px; }
    .row b { color: var(--ink); font-weight: 560; }
    .muted { color: var(--quiet) !important; }

    .capture-note { display: none; margin: 0 18px 14px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    .capture-note.saved { display: block; }
    .saved-label { color: var(--success); font-size: 11px; font-weight: 650; }
    .saved-title { margin: 3px 0 12px; overflow: hidden; color: var(--muted); font-size: 10.5px; text-overflow: ellipsis; white-space: nowrap; }
    .note-prompt { display: block; margin-bottom: 6px; font-size: 11.5px; font-weight: 620; }
    .note-form { display: flex; gap: 6px; }
    .note-input { min-width: 0; flex: 1; padding: 8px 9px; border: 1px solid var(--line); border-radius: 8px; outline: 0; color: var(--ink); background: var(--paper); font-size: 11px; transition: border-color 120ms ease, background 120ms ease; }
    .note-input::placeholder { color: var(--quiet); }
    .note-input:focus { border-color: rgba(216,90,48,.48); background: #fff; }
    .note-save { padding: 7px 11px; border: 1px solid var(--ink); border-radius: 8px; color: #fff; background: var(--ink); font-size: 11px; font-weight: 600; cursor: pointer; transition: background 120ms ease; }
    .note-save:hover { background: #373633; }
    .note-save:disabled { opacity: .45; cursor: default; }
    .note-message { min-height: 15px; margin-top: 5px; color: var(--muted); font-size: 10px; }

    .resurface-setting { margin: 0 18px 14px; padding: 12px 0 0; border-top: 1px solid var(--line); }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 11px; font-weight: 550; cursor: pointer; }
    .toggle-row input { appearance: none; width: 30px; height: 18px; margin: 0; padding: 2px; border: 1px solid #cac5bc; border-radius: 999px; background: #ddd9d1; cursor: pointer; transition: background 140ms ease, border-color 140ms ease; }
    .toggle-row input::before { content: ""; display: block; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform 140ms ease; }
    .toggle-row input:checked { border-color: var(--accent); background: var(--accent); }
    .toggle-row input:checked::before { transform: translateX(12px); }
    .privacy { margin: 6px 44px 0 0; color: var(--quiet); font-size: 9.5px; line-height: 1.45; }

    .resurfaced { display: none; margin: 0 18px 14px; padding: 11px 12px; border: 1px solid #ead7cf; border-radius: 10px; background: var(--accent-soft); }
    .resurfaced.visible { display: block; }
    .resurfaced-title { margin-bottom: 4px; color: var(--accent); font-size: 10px; font-weight: 680; }
    .resurfaced-item { display: block; width: 100%; padding: 8px 0; border: 0; border-top: 1px solid rgba(216,90,48,.13); color: inherit; background: transparent; text-align: left; cursor: pointer; }
    .resurfaced-item:first-of-type { border-top: 0; }
    .resurfaced-name { overflow: hidden; font-size: 11px; font-weight: 620; text-overflow: ellipsis; white-space: nowrap; }
    .resurfaced-meta { color: var(--muted); font-size: 9.5px; }
    .resurfaced-preview { margin-top: 3px; overflow: hidden; color: #69635c; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }

    .recall { display: block; width: calc(100% - 36px); margin: 0 18px 18px; padding: 10px 12px; border: 1px solid var(--ink); border-radius: 9px; color: #fff; background: var(--ink); text-align: center; text-decoration: none; cursor: pointer; font-weight: 620; transition: background 120ms ease, transform 120ms ease; }
    .recall:hover { background: #373633; transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="head">
    <img src="icons/icon48.png" alt="" />
    <div>
      <div class="wordmark">FootNotes</div>
      <div class="sub">Your context, kept.</div>
    </div>
  </div>

  <div class="status">
    <span id="dot" class="dot warn"></span>
    <span id="statusText">Checking…</span>
  </div>

  <div id="hint" class="hint"></div>

  <section class="resurface-setting" aria-label="Contextual resurfacing setting">
    <label class="toggle-row">
      <span>Resurface related memories while browsing</span>
      <input id="resurfacingEnabled" type="checkbox" />
    </label>
    <p class="privacy">Off by default. When enabled, bounded public-page context may be sent to your configured embedding provider. It is not saved.</p>
  </section>

  <section id="resurfaced" class="resurfaced" aria-label="Related memories for this page"></section>

  <section id="captureNote" class="capture-note" aria-label="Recent capture">
    <div class="saved-label">Saved ✓</div>
    <div id="savedTitle" class="saved-title"></div>
    <label class="note-prompt" for="noteInput">Why are you saving this?</label>
    <form id="noteForm" class="note-form">
      <input id="noteInput" class="note-input" maxlength="500" placeholder="Optional — something future-you should remember" aria-label="Why are you saving this? Optional." />
      <button id="noteSave" class="note-save" type="submit">Save</button>
    </form>
    <div id="noteMessage" class="note-message" aria-live="polite"></div>
  </section>

  <div id="stats" class="stats">
    <div class="row"><span>Tweets</span><b id="cTweets">0</b></div>
    <div class="row"><span>Articles</span><b id="cArticles">0</b></div>
    <div class="row"><span>Videos</span><b id="cYoutube">0</b></div>
    <div class="row" style="margin-top:6px;padding-top:7px;border-top:1px solid var(--line)">
      <span>Total saved</span><b id="cTotal">0</b>
    </div>
    <div class="row"><span>Enrichment</span><b id="enrich" class="muted">—</b></div>
    <div class="row"><span>Semantic memory</span><b id="semantic" class="muted">—</b></div>
    <div class="row"><span>Storage</span><b id="storage" class="muted" title="">—</b></div>
    <div class="row" id="queueRow" style="display:none"><span>Waiting to send</span><b id="cQueue">0</b></div>
  </div>

  <button id="openRecall" class="recall" type="button">Recall a memory</button>

  <script src="popup.js"></script>
</body>
</html>
