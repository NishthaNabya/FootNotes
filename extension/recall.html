<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FootNotes Recall</title>
  <link rel="stylesheet" href="recall.css" />
</head>
<body>
  <main class="shell">
    <header class="header">
      <div class="brand"><img src="icons/icon48.png" alt="" /><span>FOOTNOTES</span></div>
      <span id="connection" class="connection" aria-live="polite">Connecting…</span>
    </header>

    <section class="recall" aria-labelledby="prompt">
      <h1 id="prompt">What do you remember?</h1>
      <div class="search-wrap">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.4-4.4m2.4-5.1a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" /></svg>
        <input id="query" type="search" autocomplete="off" spellcheck="false"
               aria-label="Search your memories" aria-controls="results"
               placeholder="that tweet about invisible products…" autofocus />
        <span id="searching" class="searching" aria-live="polite"></span>
      </div>
    </section>

    <section id="state" class="state" aria-live="polite">
      <p>Type anything you remember.</p>
    </section>
    <section id="results" class="results" role="listbox" aria-label="Recall results"></section>
    <section id="related" class="related" aria-live="polite" hidden></section>

    <footer class="keys" aria-hidden="true">
      <span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> clear</span>
    </footer>
  </main>
  <script src="recall-state.js"></script>
  <script src="recall.js"></script>
</body>
</html>
